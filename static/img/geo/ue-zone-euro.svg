<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Union europeenne - Zone euro</title>
  <desc id="desc">Carte schematique de l'Union europeenne. Les pays de la zone euro sont mis en evidence dans une couleur, les autres pays de l'UE dans une autre teinte. Legende avec deux carres de couleur.</desc>

  <!-- Fond mer -->
  <rect x="0" y="0" width="600" height="400" fill="#eef3f7"/>

  <!-- Pays UE hors zone euro (teinte claire) -->
  <g fill="#bcd4e6" stroke="#7a93a8" stroke-width="1.5" stroke-linejoin="round">
    <!-- Suede / nord -->
    <path d="M300 30 L345 35 L355 100 L320 130 L295 95 Z"/>
    <!-- Pologne / est -->
    <path d="M360 150 L440 145 L445 210 L370 215 L355 180 Z"/>
    <!-- Tchequie / Hongrie / Roumanie bloc est -->
    <path d="M370 220 L460 225 L470 290 L380 295 L360 255 Z"/>
    <!-- Danemark -->
    <path d="M290 135 L325 135 L320 165 L292 162 Z"/>
    <!-- Bulgarie -->
    <path d="M400 300 L455 305 L450 340 L405 335 Z"/>
  </g>

  <!-- Pays zone euro (teinte mise en evidence) -->
  <g fill="#f0a830" stroke="#a86a10" stroke-width="1.5" stroke-linejoin="round">
    <!-- Irlande -->
    <path d="M120 130 L155 130 L150 165 L118 162 Z"/>
    <!-- France -->
    <path d="M170 175 L250 170 L275 230 L240 290 L180 285 L160 220 Z"/>
    <!-- Espagne / Portugal -->
    <path d="M120 295 L240 300 L235 360 L110 355 Z"/>
    <!-- Allemagne -->
    <path d="M265 130 L340 135 L350 200 L275 205 L260 165 Z"/>
    <!-- Italie -->
    <path d="M285 240 L330 245 L350 360 L300 330 L280 280 Z"/>
    <!-- Benelux -->
    <path d="M240 140 L262 140 L260 168 L238 166 Z"/>
    <!-- Grece -->
    <path d="M400 345 L460 350 L455 385 L405 380 Z"/>
    <!-- Finlande / Baltes -->
    <path d="M370 60 L415 65 L420 135 L375 130 Z"/>
  </g>

  <!-- Legende -->
  <g font-family="sans-serif" font-size="15" fill="#1a3a5a">
    <rect x="30" y="340" width="22" height="22" fill="#f0a830" stroke="#a86a10" stroke-width="1.5"/>
    <text x="60" y="357">Zone euro</text>
    <rect x="30" y="370" width="22" height="22" fill="#bcd4e6" stroke="#7a93a8" stroke-width="1.5"/>
    <text x="60" y="387">Reste de l'UE</text>
  </g>
</svg>
