<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">France - DROM</title>
  <desc id="desc">Cinq vignettes schematiques representant les departements et regions d'outre-mer numerotes de 1 a 5 : Guadeloupe, Martinique, Guyane, La Reunion et Mayotte. Les quatre DROM insulaires (1, 2, 4, 5) ont un contour bleu epais ; la Guyane (3), non insulaire, garde un contour gris.</desc>

  <g stroke="#3a4a5a" stroke-width="2">
    <!-- 1 Guadeloupe (forme papillon) - insulaire, contour bleu -->
    <rect x="20" y="20" width="110" height="110" rx="6" fill="#f7fafc" stroke="#1f6fb2" stroke-width="3.5"/>
    <path d="M55 75 Q60 55 75 60 Q70 75 85 78 Q100 70 105 82 Q98 95 82 90 Q70 100 60 92 Q48 88 55 75 Z" fill="#7fb069" stroke="#3a6324" stroke-width="1.5"/>

    <!-- 2 Martinique - insulaire, contour bleu -->
    <rect x="145" y="20" width="110" height="110" rx="6" fill="#f7fafc" stroke="#1f6fb2" stroke-width="3.5"/>
    <path d="M185 55 Q205 50 210 70 Q220 80 205 95 Q190 105 185 90 Q175 80 180 65 Z" fill="#7fb069" stroke="#3a6324" stroke-width="1.5"/>

    <!-- 3 Guyane (grande masse continentale) - non insulaire, contour gris -->
    <rect x="270" y="20" width="110" height="110" rx="6" fill="#f7fafc" stroke="#9aa3ac" stroke-width="2"/>
    <path d="M295 50 L350 45 L362 80 L340 110 L300 108 L288 75 Z" fill="#7fb069" stroke="#3a6324" stroke-width="1.5"/>

    <!-- 4 La Reunion - insulaire, contour bleu -->
    <rect x="20" y="155" width="110" height="110" rx="6" fill="#f7fafc" stroke="#1f6fb2" stroke-width="3.5"/>
    <ellipse cx="75" cy="210" rx="38" ry="30" fill="#7fb069" stroke="#3a6324" stroke-width="1.5"/>

    <!-- 5 Mayotte - insulaire, contour bleu -->
    <rect x="145" y="155" width="110" height="110" rx="6" fill="#f7fafc" stroke="#1f6fb2" stroke-width="3.5"/>
    <path d="M185 185 Q210 185 212 210 Q205 235 188 232 Q172 225 178 205 Q175 190 185 185 Z" fill="#7fb069" stroke="#3a6324" stroke-width="1.5"/>
  </g>

  <!-- Legende -->
  <g font-family="sans-serif" font-size="12" fill="#1a3a5a">
    <rect x="272" y="200" width="18" height="18" rx="3" fill="#f7fafc" stroke="#1f6fb2" stroke-width="3.5"/>
    <text x="296" y="213">DROM insulaire</text>
    <rect x="272" y="228" width="18" height="18" rx="3" fill="#f7fafc" stroke="#9aa3ac" stroke-width="2"/>
    <text x="296" y="241">non insulaire</text>
  </g>

  <!-- Numeros (coin de chaque vignette) -->
  <g font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">
    <circle cx="38" cy="38" r="13" fill="#ffffff" stroke="#3a4a5a" stroke-width="2"/>
    <text x="38" y="43" fill="#1a3a5a">1</text>
    <circle cx="163" cy="38" r="13" fill="#ffffff" stroke="#3a4a5a" stroke-width="2"/>
    <text x="163" y="43" fill="#1a3a5a">2</text>
    <circle cx="288" cy="38" r="13" fill="#ffffff" stroke="#3a4a5a" stroke-width="2"/>
    <text x="288" y="43" fill="#1a3a5a">3</text>
    <circle cx="38" cy="173" r="13" fill="#ffffff" stroke="#3a4a5a" stroke-width="2"/>
    <text x="38" y="178" fill="#1a3a5a">4</text>
    <circle cx="163" cy="173" r="13" fill="#ffffff" stroke="#3a4a5a" stroke-width="2"/>
    <text x="163" y="178" fill="#1a3a5a">5</text>
  </g>
</svg>
