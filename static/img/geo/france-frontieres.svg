<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">France - Pays frontaliers</title>
  <desc id="desc">La France au centre, en couleur, entouree de ses pays frontaliers en gris numerotes : 1 Belgique, 2 Luxembourg, 3 Allemagne, 4 Suisse, 5 Italie, 6 Espagne, et 7 Royaume-Uni de l'autre cote de la Manche, relie par un tunnel figure en pointilles.</desc>

  <!-- Voisins (gris) -->
  <g fill="#d6dbe0" stroke="#9aa3ac" stroke-width="2" stroke-linejoin="round">
    <!-- Royaume-Uni (de l'autre cote de la Manche, au nord-ouest) -->
    <path d="M55 25 L110 30 L100 70 L70 95 L40 80 L48 50 Z"/>
    <!-- Belgique (nord) -->
    <path d="M150 30 L230 35 L225 80 L160 90 L140 60 Z"/>
    <!-- Luxembourg (petit, nord-est) -->
    <path d="M232 78 L255 82 L250 105 L230 100 Z"/>
    <!-- Allemagne (est haut) -->
    <path d="M258 60 L360 70 L360 180 L300 170 L270 110 Z"/>
    <!-- Suisse (est milieu) -->
    <path d="M300 178 L360 190 L355 230 L300 222 Z"/>
    <!-- Italie (sud-est) -->
    <path d="M305 232 L360 245 L370 360 L300 330 L295 270 Z"/>
    <!-- Espagne (sud) -->
    <path d="M70 320 L240 330 L235 390 L60 385 Z"/>
  </g>

  <!-- France (couleur, au centre) -->
  <path d="M150 95 L225 88 L268 115 L300 175 L300 225 L295 268 L255 320 L160 318 L95 310 L70 250 L75 160 L120 100 Z"
        fill="#3a78c2" stroke="#1f4d80" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Tunnel sous la Manche : Royaume-Uni vers cote francaise -->
  <line x1="88" y1="88" x2="128" y2="103" stroke="#1f4d80" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- Numeros voisins -->
  <g font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">
    <circle cx="185" cy="58" r="13" fill="#ffffff" stroke="#5a6570" stroke-width="2"/>
    <text x="185" y="63" fill="#333">1</text>
    <circle cx="242" cy="92" r="12" fill="#ffffff" stroke="#5a6570" stroke-width="2"/>
    <text x="242" y="97" fill="#333">2</text>
    <circle cx="320" cy="120" r="13" fill="#ffffff" stroke="#5a6570" stroke-width="2"/>
    <text x="320" y="125" fill="#333">3</text>
    <circle cx="330" cy="205" r="13" fill="#ffffff" stroke="#5a6570" stroke-width="2"/>
    <text x="330" y="210" fill="#333">4</text>
    <circle cx="335" cy="295" r="13" fill="#ffffff" stroke="#5a6570" stroke-width="2"/>
    <text x="335" y="300" fill="#333">5</text>
    <circle cx="150" cy="360" r="13" fill="#ffffff" stroke="#5a6570" stroke-width="2"/>
    <text x="150" y="365" fill="#333">6</text>
    <circle cx="68" cy="58" r="13" fill="#ffffff" stroke="#5a6570" stroke-width="2"/>
    <text x="68" y="63" fill="#333">7</text>
  </g>
</svg>
