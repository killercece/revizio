<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Monde - Reperes (latitudes, BRICS, canaux)</title>
  <desc id="desc">Planisphere schematique montrant l'equateur et les deux tropiques en pointilles, les cinq pays BRICS numerotes de 1 a 5 (Bresil, Russie, Inde, Chine, Afrique du Sud) et les deux canaux Panama et Suez reperes par un symbole.</desc>

  <!-- Fond ocean -->
  <rect x="0" y="0" width="800" height="400" fill="#dbe9f4"/>

  <!-- Continents schematiques -->
  <g fill="#c9d6bf" stroke="#7e8c6e" stroke-width="1.5" stroke-linejoin="round">
    <!-- Amerique du Nord -->
    <path d="M70 60 L190 50 L210 130 L160 175 L120 160 L80 110 Z"/>
    <!-- Amerique du Sud -->
    <path d="M175 200 L240 195 L255 270 L215 340 L185 300 L175 240 Z"/>
    <!-- Europe -->
    <path d="M380 70 L450 65 L455 120 L400 130 L375 100 Z"/>
    <!-- Afrique -->
    <path d="M390 150 L470 145 L490 230 L450 320 L410 290 L385 210 Z"/>
    <!-- Asie -->
    <path d="M460 55 L680 60 L700 150 L600 175 L500 150 L460 110 Z"/>
    <!-- Inde (sous-continent) -->
    <path d="M560 150 L610 152 L600 210 L575 215 Z"/>
    <!-- Oceanie -->
    <path d="M660 250 L740 255 L735 305 L670 300 Z"/>
  </g>

  <!-- Lignes de latitude (pointilles) -->
  <g stroke="#b5651d" stroke-width="1.6" stroke-dasharray="7 5" fill="none">
    <line x1="0" y1="130" x2="800" y2="130"/>  <!-- Tropique du Cancer -->
    <line x1="0" y1="200" x2="800" y2="200"/>  <!-- Equateur -->
    <line x1="0" y1="270" x2="800" y2="270"/>  <!-- Tropique du Capricorne -->
  </g>
  <g font-family="sans-serif" font-size="11" fill="#8a4a12" font-style="italic">
    <text x="8" y="125">Tropique du Cancer</text>
    <text x="8" y="195">Equateur</text>
    <text x="8" y="265">Tropique du Capricorne</text>
  </g>

  <!-- Canaux : symbole losange -->
  <g>
    <!-- Panama (entre Ameriques) -->
    <rect x="166" y="186" width="14" height="14" fill="#c0392b" stroke="#ffffff" stroke-width="2" transform="rotate(45 173 193)"/>
    <text x="173" y="218" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7a1d12" text-anchor="middle">Panama</text>
    <!-- Suez (Mediterranee / mer Rouge) -->
    <rect x="463" y="138" width="14" height="14" fill="#c0392b" stroke="#ffffff" stroke-width="2" transform="rotate(45 470 145)"/>
    <text x="470" y="172" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7a1d12" text-anchor="middle">Suez</text>
  </g>

  <!-- BRICS : pastilles numerotees -->
  <g font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">
    <!-- 1 Bresil -->
    <circle cx="210" cy="250" r="13" fill="#1f6fb2" stroke="#ffffff" stroke-width="2"/><text x="210" y="255" fill="#ffffff">1</text>
    <!-- 2 Russie -->
    <circle cx="600" cy="90" r="13" fill="#1f6fb2" stroke="#ffffff" stroke-width="2"/><text x="600" y="95" fill="#ffffff">2</text>
    <!-- 3 Inde -->
    <circle cx="585" cy="185" r="13" fill="#1f6fb2" stroke="#ffffff" stroke-width="2"/><text x="585" y="190" fill="#ffffff">3</text>
    <!-- 4 Chine -->
    <circle cx="650" cy="130" r="13" fill="#1f6fb2" stroke="#ffffff" stroke-width="2"/><text x="650" y="135" fill="#ffffff">4</text>
    <!-- 5 Afrique du Sud -->
    <circle cx="445" cy="305" r="13" fill="#1f6fb2" stroke="#ffffff" stroke-width="2"/><text x="445" y="310" fill="#ffffff">5</text>
  </g>

  <!-- Legende -->
  <g font-family="sans-serif" font-size="12" fill="#1a3a5a">
    <circle cx="625" cy="345" r="9" fill="#1f6fb2"/><text x="640" y="349">BRICS (1-5)</text>
    <rect x="618" y="362" width="13" height="13" fill="#c0392b" transform="rotate(45 624 368)"/><text x="640" y="372">Canal</text>
  </g>
</svg>
