<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">France - Metropoles</title>
  <desc id="desc">Silhouette schematique de la France metropolitaine avec six villes numerotees de 1 a 6 : Paris, Lille, Strasbourg, Lyon, Marseille et Bordeaux.</desc>
  <path d="M150 40 L210 50 L255 95 L300 110 L315 170 L295 230 L300 300 L240 345 L170 350 L120 320 L70 270 L65 200 L95 140 L110 80 Z"
        fill="#eef3f7" stroke="#3a4a5a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Villes : gros point + numero -->
  <g font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">
    <!-- 1 Paris -->
    <circle cx="170" cy="125" r="13" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
    <text x="170" y="130" fill="#ffffff">1</text>
    <!-- 2 Lille (nord) -->
    <circle cx="180" cy="65" r="13" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
    <text x="180" y="70" fill="#ffffff">2</text>
    <!-- 3 Strasbourg (est) -->
    <circle cx="295" cy="135" r="13" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
    <text x="295" y="140" fill="#ffffff">3</text>
    <!-- 4 Lyon (centre-est) -->
    <circle cx="248" cy="220" r="13" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
    <text x="248" y="225" fill="#ffffff">4</text>
    <!-- 5 Marseille (sud) -->
    <circle cx="255" cy="305" r="13" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
    <text x="255" y="310" fill="#ffffff">5</text>
    <!-- 6 Bordeaux (sud-ouest) -->
    <circle cx="120" cy="280" r="13" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
    <text x="120" y="285" fill="#ffffff">6</text>
  </g>
</svg>
