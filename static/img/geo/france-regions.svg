<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">France - Regions administratives</title>
  <desc id="desc">Silhouette schematique de la France metropolitaine decoupee en treize regions administratives numerotees de 1 a 13 : Hauts-de-France, Normandie, Ile-de-France, Grand Est, Bretagne, Pays de la Loire, Centre-Val de Loire, Bourgogne-Franche-Comte, Nouvelle-Aquitaine, Auvergne-Rhone-Alpes, Occitanie, Provence-Alpes-Cote d'Azur et Corse.</desc>

  <!-- Decoupage schematique en regions (couleurs alternees pour la lisibilite) -->
  <g stroke="#3a4a5a" stroke-width="1.6" stroke-linejoin="round">
    <!-- 5 Bretagne (ouest, pointe) -->
    <path d="M70 165 L120 160 L130 195 L95 215 L65 200 Z" fill="#cfe3f0"/>
    <!-- 2 Normandie (nord-ouest) -->
    <path d="M110 90 L175 100 L170 140 L120 160 L100 120 Z" fill="#e6eef5"/>
    <!-- 1 Hauts-de-France (nord) -->
    <path d="M175 50 L230 55 L225 100 L175 100 L160 75 Z" fill="#cfe3f0"/>
    <!-- 4 Grand Est (nord-est) -->
    <path d="M230 60 L300 80 L305 160 L255 150 L225 100 Z" fill="#e6eef5"/>
    <!-- 3 Ile-de-France (centre-nord, petite) -->
    <path d="M175 105 L218 105 L218 145 L178 145 Z" fill="#f5d6a8"/>
    <!-- 6 Pays de la Loire (ouest) -->
    <path d="M95 215 L150 200 L160 245 L110 255 Z" fill="#e6eef5"/>
    <!-- 7 Centre-Val de Loire (centre) -->
    <path d="M160 150 L225 150 L228 205 L165 210 Z" fill="#cfe3f0"/>
    <!-- 8 Bourgogne-Franche-Comte (centre-est) -->
    <path d="M228 152 L305 162 L300 235 L235 225 Z" fill="#f5d6a8"/>
    <!-- 9 Nouvelle-Aquitaine (sud-ouest, grande) -->
    <path d="M65 205 L165 215 L170 290 L140 330 L80 300 Z" fill="#cfe3f0"/>
    <!-- 10 Auvergne-Rhone-Alpes (centre-est, grande) -->
    <path d="M170 215 L300 240 L295 320 L210 315 L170 285 Z" fill="#e6eef5"/>
    <!-- 11 Occitanie (sud) -->
    <path d="M140 305 L210 318 L235 345 L150 345 L120 320 Z" fill="#f5d6a8"/>
    <!-- 12 PACA (sud-est) -->
    <path d="M260 305 L320 300 L325 345 L260 350 L235 330 Z" fill="#cfe3f0"/>
    <!-- 13 Corse (ile au sud-est) -->
    <path d="M345 320 L357 312 L362 352 L350 372 L340 348 Z" fill="#f5d6a8"/>
  </g>

  <!-- Numeros en pastilles blanches -->
  <g font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">
    <circle cx="195" cy="76" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="195" y="81" fill="#1a3a5a">1</text>
    <circle cx="138" cy="122" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="138" y="127" fill="#1a3a5a">2</text>
    <circle cx="198" cy="125" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="198" y="130" fill="#1a3a5a">3</text>
    <circle cx="270" cy="115" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="270" y="120" fill="#1a3a5a">4</text>
    <circle cx="95" cy="186" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="95" y="191" fill="#1a3a5a">5</text>
    <circle cx="128" cy="228" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="128" y="233" fill="#1a3a5a">6</text>
    <circle cx="192" cy="180" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="192" y="185" fill="#1a3a5a">7</text>
    <circle cx="267" cy="195" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="267" y="200" fill="#1a3a5a">8</text>
    <circle cx="115" cy="265" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="115" y="270" fill="#1a3a5a">9</text>
    <circle cx="240" cy="275" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="240" y="280" fill="#1a3a5a">10</text>
    <circle cx="175" cy="330" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="175" y="335" fill="#1a3a5a">11</text>
    <circle cx="288" cy="325" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="288" y="330" fill="#1a3a5a">12</text>
    <circle cx="351" cy="342" r="12" fill="#ffffff" stroke="#3a4a5a" stroke-width="1.8"/><text x="351" y="347" fill="#1a3a5a">13</text>
  </g>
</svg>
